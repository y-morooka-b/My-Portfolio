services:
  # Backend
  portfolio-backend:
    container_name: portfolio-backend
    build: 
      context: .
      dockerfile: ./Python/Dockerfile
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - "./Project/My-Portfolio-Back:/mysite"
    ports:
      - "8000:8000"
    tty: true
    working_dir: "/mysite"
    networks:
      - portfolio-networks

  # データベース
  portfolio-db:
    container_name: portfolio-db
    build: 
      context: .
      dockerfile: ./MySQL/Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - "./MySQL/strage:/var/lib/mysql"
    ports:
      - "3306:3306"
    tty: true
    networks:
      - portfolio-networks

  # Frontend
  portfolio-frontend:
    container_name: portfolio-frontend
    user: "1000:1000"
    build: 
      context: .
      dockerfile: ./Node/Dockerfile
    volumes:
      - "./Project/My-Portfolio-Front:/home/node/app"
    ports:
      - "3000:3000"
    tty: true
    networks:
      - portfolio-networks

networks:
  portfolio-networks:
    driver: bridge
